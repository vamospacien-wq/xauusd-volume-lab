name: Análisis diario del oro

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "45 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar análisis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/gold_analysis.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data/gold-analysis.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Análisis diario del oro"
            git pull --rebase
            git push
          fi
